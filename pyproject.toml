[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralgig"
version = "0.1.0"
description = "AI-native freelancing platform domain logic"
authors = [{name = "NeuralGig"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.23,<0.32",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
